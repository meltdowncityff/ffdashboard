<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FFAddict Fantasy Football Dashboard</title>
  
  <!-- Bootstrap 5 & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">

  <style>
    :root {
      --bg-dark: #0f111a;
      --card-bg: rgba(26, 29, 45, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-purple: #6f42c1;
      --accent-blue: #0d6efd;
    }

    body {
      background: radial-gradient(circle at top right, #1a1c2e, var(--bg-dark));
      background-attachment: fixed;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #e2e8f0;
      min-height: 100vh;
    }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .glass-nav {
      background: rgba(15, 17, 26, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--card-border);
    }

    .navbar-brand {
      font-weight: 700;
      background: linear-gradient(135deg, #a78bfa, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .avatar-img {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.1);
    }

    .table {
      --bs-table-bg: transparent;
      --bs-table-color: #e2e8f0;
      border-color: var(--card-border);
    }

    .table th {
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      color: #94a3b8;
      border-bottom: 1px solid var(--card-border);
    }

    .badge-win { background: rgba(25, 135, 84, 0.2); color: #4ade80; border: 1px solid rgba(25, 135, 84, 0.3); }

    .nav-pills .nav-link {
      color: #94a3b8;
      border-radius: 10px;
      padding: 8px 16px;
      font-weight: 500;
    }

    .nav-pills .nav-link.active {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }

    .form-control, .form-select {
      background: rgba(15, 17, 26, 0.6);
      border: 1px solid var(--card-border);
      color: #fff;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <nav class="navbar navbar-expand-lg sticky-top glass-nav py-3">
    <div class="container-fluid px-4">
      <a class="navbar-brand fs-4 d-flex align-items-center gap-2" href="#">
        <i class="bi bi-trophy-fill text-warning"></i> FFAddict Dashboard
      </a>
      
      <div class="d-flex align-items-center gap-2 ms-auto">
        <input type="text" id="usernameInput" class="form-control form-control-sm" style="width: 160px;" placeholder="Sleeper Username">
        <select id="seasonSelect" class="form-select form-select-sm" style="width: 100px;">
          <!-- Dynamically populated by JS -->
        </select>
        <button id="fetchBtn" class="btn btn-primary btn-sm rounded-3 px-3">
          <i class="bi bi-arrow-clockwise"></i> Load
        </button>
      </div>
    </div>
  </nav>

  <!-- Main Container -->
  <div class="container-fluid px-4 py-4">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
      <ul class="nav nav-pills glass-card p-2 gap-1">
        <li class="nav-item">
          <button class="nav-link active" id="leagues-tab" type="button">
            <i class="bi bi-grid-fill me-1"></i> My Leagues
          </button>
        </li>
      </ul>

      <div class="d-flex gap-3 text-sm">
        <div class="glass-card px-3 py-2 text-center">
          <div class="text-secondary small">Total Leagues (<span id="selectedSeasonLabel"></span>)</div>
          <div id="statTotalLeagues" class="fw-bold fs-5 text-white">0</div>
        </div>
      </div>
    </div>

    <!-- Leagues Table -->
    <div class="glass-card p-4">
      <div class="table-responsive">
        <table class="table align-middle">
          <thead>
            <tr>
              <th>League</th>
              <th>Teams</th>
              <th>Record</th>
              <th>Points For</th>
              <th>MaxPF</th>
            </tr>
          </thead>
          <tbody id="leaguesTableBody">
            <tr>
              <td colspan="5" class="text-center text-muted py-5">Enter your Sleeper Username above to load your leagues.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Calculate current NFL season year automatically
    // (If date is before March, the season year belongs to the previous calendar year)
    function getCurrentNFLSeason() {
      const now = new Date();
      const month = now.getMonth(); // 0 = Jan, 1 = Feb, 2 = Mar
      const year = now.getFullYear();
      return month < 2 ? year - 1 : year;
    }

    const currentSeason = getCurrentNFLSeason();

    document.addEventListener('DOMContentLoaded', () => {
      // Setup Season Dropdown dynamically
      const seasonSelect = document.getElementById('seasonSelect');
      seasonSelect.innerHTML = `
        <option value="${currentSeason}" selected>${currentSeason}</option>
        <option value="${currentSeason - 1}">${currentSeason - 1}</option>
        <option value="${currentSeason - 2}">${currentSeason - 2}</option>
      `;

      // Auto-load remembered username
      const savedUser = localStorage.getItem('sleeper_username');
      if (savedUser) {
        document.getElementById('usernameInput').value = savedUser;
        fetchLeagues();
      }
    });

    document.getElementById('fetchBtn').addEventListener('click', fetchLeagues);

    async function fetchLeagues() {
      const username = document.getElementById('usernameInput').value.trim();
      const season = document.getElementById('seasonSelect').value;
      if (!username) return alert('Please enter a Sleeper username.');

      localStorage.setItem('sleeper_username', username);
      document.getElementById('selectedSeasonLabel').textContent = season;

      const tbody = document.getElementById('leaguesTableBody');
      tbody.innerHTML = `<tr><td colspan="5" class="text-center py-5"><div class="spinner-border text-primary" role="status"></div><div class="mt-2 text-muted">Fetching ${season} leagues...</div></td></tr>`;

      try {
        // 1. Fetch User Object
        const userRes = await fetch(`https://api.sleeper.app/v1/user/${username}`);
        const userData = await userRes.json();
        if (!userData || !userData.user_id) throw new Error('User not found.');

        // 2. Fetch User Leagues for Selected Season
        const leaguesRes = await fetch(`https://api.sleeper.app/v1/user/${userData.user_id}/leagues/nfl/${season}`);
        const leagues = await leaguesRes.json();

        document.getElementById('statTotalLeagues').textContent = leagues.length;

        if (!Array.isArray(leagues) || leagues.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted py-5">No leagues found for ${username} in ${season}.</td></tr>`;
          return;
        }

        tbody.innerHTML = '';

        // 3. Render Leagues
        for (const league of leagues) {
          const rostersRes = await fetch(`https://api.sleeper.app/v1/league/${league.league_id}/rosters`);
          const rosters = await rostersRes.json();
          const userRoster = rosters.find(r => r.owner_id === userData.user_id);

          const pf = userRoster ? parseFloat((userRoster.settings.fpts || 0) + '.' + (userRoster.settings.fpts_decimal || 0)) : 0;
          const maxPf = userRoster ? parseFloat((userRoster.settings.ppts || pf) + '.' + (userRoster.settings.ppts_decimal || 0)) : 0;
          const wins = userRoster ? (userRoster.settings.wins || 0) : 0;
          const losses = userRoster ? (userRoster.settings.losses || 0) : 0;

          const avatar = league.avatar ? `https://sleepercdn.com/avatars/thumbs/${league.avatar}` : 'https://sleepercdn.com/images/v2/default_avatar-512x512.png';

          tbody.innerHTML += `
            <tr>
              <td>
                <div class="d-flex align-items-center gap-3">
                  <img src="${avatar}" class="avatar-img" alt="avatar">
                  <div>
                    <div class="fw-bold">${league.name}</div>
                    <div class="small text-muted">${league.season} Season</div>
                  </div>
                </div>
              </td>
              <td>${league.total_rosters} Teams</td>
              <td><span class="badge badge-win px-2 py-1 rounded-2">${wins} - ${losses}</span></td>
              <td class="fw-semibold text-white">${pf.toFixed(1)}</td>
              <td class="text-muted">${maxPf.toFixed(1)}</td>
            </tr>
          `;
        }

      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center text-danger py-4">Error fetching data: ${err.message}</td></tr>`;
      }
    }
  </script>
</body>
</html>
