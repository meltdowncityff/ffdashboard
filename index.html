<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FFAddict Fantasy Football Dashboard</title>
  
  <!-- Bootstrap 5 & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">

  <style>
    :root {
      --bg-dark: #0f111a;
      --card-bg: rgba(26, 29, 45, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-purple: #6f42c1;
      --accent-blue: #0d6efd;
      --accent-green: #198754;
      --accent-red: #dc3545;
    }

    body {
      background: radial-gradient(circle at top right, #1a1c2e, var(--bg-dark));
      background-attachment: fixed;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #e2e8f0;
      min-height: 100vh;
    }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .glass-nav {
      background: rgba(15, 17, 26, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--card-border);
    }

    .navbar-brand {
      font-weight: 700;
      background: linear-gradient(135deg, #a78bfa, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .avatar-img {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.1);
    }

    .player-headshot {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #2a2d3d;
      object-fit: cover;
    }

    .table {
      --bs-table-bg: transparent;
      --bs-table-color: #e2e8f0;
      border-color: var(--card-border);
    }

    .table th {
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      color: #94a3b8;
      border-bottom: 1px solid var(--card-border);
    }

    .badge-win { background: rgba(25, 135, 84, 0.2); color: #4ade80; border: 1px solid rgba(25, 135, 84, 0.3); }
    .badge-loss { background: rgba(220, 53, 69, 0.2); color: #f87171; border: 1px solid rgba(220, 53, 69, 0.3); }
    .badge-rank { background: rgba(13, 110, 253, 0.2); color: #60a5fa; border: 1px solid rgba(13, 110, 253, 0.3); }

    .nav-pills .nav-link {
      color: #94a3b8;
      border-radius: 10px;
      padding: 8px 16px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .nav-pills .nav-link.active {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }

    .form-control, .form-select {
      background: rgba(15, 17, 26, 0.6);
      border: 1px solid var(--card-border);
      color: #fff;
      border-radius: 10px;
    }

    .form-control:focus, .form-select:focus {
      background: rgba(15, 17, 26, 0.9);
      border-color: #6366f1;
      color: #fff;
      box-shadow: 0 0 0 0.25rem rgba(99, 102, 241, 0.25);
    }

    /* Responsive mobile tweaks */
    @media (max-width: 768px) {
      .glass-card { padding: 1rem !important; }
      .avatar-img { width: 34px; height: 34px; }
    }
  </style>
</head>
<body>

  <!-- Top Glass Navigation -->
  <nav class="navbar navbar-expand-lg sticky-top glass-nav py-3">
    <div class="container-fluid px-4">
      <a class="navbar-brand fs-4 d-flex align-items-center gap-2" href="#">
        <i class="bi bi-trophy-fill text-warning"></i> FFAddict Dashboard
      </a>
      
      <div class="d-flex align-items-center gap-2 ms-auto">
        <input type="text" id="usernameInput" class="form-control form-control-sm" style="width: 140px;" placeholder="Sleeper Username">
        <select id="seasonSelect" class="form-select form-select-sm" style="width: 90px;">
          <option value="2026">2026</option>
          <option value="2025" selected>2025</option>
          <option value="2024">2024</option>
        </select>
        <button id="fetchBtn" class="btn btn-primary btn-sm rounded-3 px-3">
          <i class="bi bi-arrow-clockwise"></i> Load
        </button>
      </div>
    </div>
  </nav>

  <!-- Main Container -->
  <div class="container-fluid px-4 py-4">
    
    <!-- Tab Navigation -->
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
      <ul class="nav nav-pills glass-card p-2 gap-1" id="dashboardTabs" role="tablist">
        <li class="nav-item">
          <button class="nav-link active" id="leagues-tab" data-bs-toggle="tab" data-bs-target="#leagues" type="button">
            <i class="bi bi-grid-fill me-1"></i> My Leagues
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link" id="shares-tab" data-bs-toggle="tab" data-bs-target="#shares" type="button">
            <i class="bi bi-pie-chart-fill me-1"></i> Player Shares
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link" id="trades-tab" data-bs-toggle="tab" data-bs-target="#trades" type="button">
            <i class="bi bi-arrow-left-right me-1"></i> Trade History
          </button>
        </li>
      </ul>

      <!-- Quick Summary Stats Header -->
      <div id="quickStats" class="d-flex gap-3 text-sm">
        <div class="glass-card px-3 py-2 text-center">
          <div class="text-secondary small">Total Leagues</div>
          <div id="statTotalLeagues" class="fw-bold fs-5 text-white">0</div>
        </div>
        <div class="glass-card px-3 py-2 text-center">
          <div class="text-secondary small">Win Rate</div>
          <div id="statWinRate" class="fw-bold fs-5 text-success">0%</div>
        </div>
      </div>
    </div>

    <!-- Tab Contents -->
    <div class="tab-content" id="dashboardTabsContent">
      
      <!-- LEAGUES TAB -->
      <div class="tab-pane fade show active" id="leagues" role="tabpanel">
        <div class="glass-card p-4">
          <div class="table-responsive">
            <table class="table align-middle" id="leaguesTable">
              <thead>
                <tr>
                  <th>League</th>
                  <th>Record</th>
                  <th>PF Rank</th>
                  <th>MaxPF Rank</th>
                  <th>Roster Avg Age</th>
                  <th>Paid Status</th>
                </tr>
              </thead>
              <tbody id="leaguesTableBody">
                <tr>
                  <td colspan="6" class="text-center text-muted py-5">Enter a Sleeper username above to load your leagues.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- PLAYER SHARES TAB -->
      <div class="tab-pane fade" id="shares" role="tabpanel">
        <div class="glass-card p-4">
          <div class="table-responsive">
            <table class="table align-middle" id="sharesTable">
              <thead>
                <tr>
                  <th>Player</th>
                  <th>Pos</th>
                  <th>NFL Team</th>
                  <th>Total Shares</th>
                  <th>Exposure %</th>
                </tr>
              </thead>
              <tbody id="sharesTableBody">
                <tr>
                  <td colspan="5" class="text-center text-muted py-5">No player shares available.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- TRADES TAB -->
      <div class="tab-pane fade" id="trades" role="tabpanel">
        <div class="glass-card p-4">
          <div id="tradesContainer" class="d-flex flex-column gap-3">
            <div class="text-center text-muted py-5">No trade history loaded.</div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Demo JS renderer to verify glassmorphism rendering
    document.getElementById('fetchBtn').addEventListener('click', () => {
      const user = document.getElementById('usernameInput').value || 'User';
      document.getElementById('statTotalLeagues').textContent = '12';
      document.getElementById('statWinRate').textContent = '64.2%';
      
      const tbody = document.getElementById('leaguesTableBody');
      tbody.innerHTML = `
        <tr>
          <td>
            <div class="d-flex align-items-center gap-3">
              <img src="https://sleepercdn.com/images/v2/default_avatar-512x512.png" class="avatar-img" alt="league">
              <div>
                <div class="fw-bold">Dynasty Superflex League</div>
                <div class="small text-muted">12 Teams · PPR</div>
              </div>
            </div>
          </td>
          <td><span class="badge badge-win px-2 py-1 rounded-2">10 - 4</span></td>
          <td><span class="badge badge-rank px-2 py-1 rounded-2">#2 / 12</span></td>
          <td><span class="badge badge-rank px-2 py-1 rounded-2">#1 / 12</span></td>
          <td>24.3 yrs</td>
          <td><span class="badge bg-success-subtle text-success border border-success-subtle px-2 py-1">Paid</span></td>
        </tr>
      `;
    });
  </script>
</body>
</html>
