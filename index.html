<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FFAddict Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #0f111a;
      font-family: 'Inter', sans-serif;
      color: #e2e8f0;
    }
    .glass-card {
      background: #1a1d2d;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
    }
    .league-link {
      color: #38bdf8;
      cursor: pointer;
      font-weight: 600;
      text-decoration: none;
    }
    .league-link:hover { text-decoration: underline; color: #7dd3fc; }
    .section-header {
      border-bottom: 2px solid #3b4261;
      padding-bottom: 8px;
      margin-top: 32px;
      margin-bottom: 16px;
      font-size: 1.2rem;
      font-weight: 700;
      color: #f8fafc;
    }
    .avatar-img {
      width: 36px; height: 36px;
      border-radius: 50%; object-fit: cover;
    }
    .status-active { color: #4ade80; }
    .status-ques { color: #facc15; }
    .status-out { color: #f87171; }
    
    /* Custom Tabs */
    .custom-tab {
      background: transparent; border: 1px solid #3b4261; color: #94a3b8;
      padding: 8px 16px; border-radius: 8px; font-weight: 600; transition: all 0.2s;
    }
    .custom-tab.active { background: #6366f1; color: white; border-color: #6366f1; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark border-bottom border-secondary mb-4 py-3">
    <div class="container-fluid px-4">
      <span class="navbar-brand fw-bold text-white"><i class="bi bi-trophy-fill text-warning"></i> FFAddict</span>
      <div class="d-flex gap-2">
        <input type="text" id="usernameInput" class="form-control form-control-sm bg-dark text-white border-secondary" placeholder="Sleeper Username" style="width: 150px;">
        <select id="seasonSelect" class="form-select form-select-sm bg-dark text-white border-secondary" style="width: 90px;"></select>
        <button id="fetchBtn" class="btn btn-primary btn-sm px-3 fw-bold">Load Data</button>
      </div>
    </div>
  </nav>

  <!-- Main Area -->
  <div class="container-fluid px-4">
    
    <!-- Tab Controls -->
    <div class="d-flex gap-2 mb-4">
      <button class="custom-tab active" onclick="switchTab('leaguesTab', this)">My Leagues</button>
      <button class="custom-tab" onclick="switchTab('playersTab', this)">My Players</button>
    </div>

    <!-- Loading State -->
    <div id="loadingIndicator" class="text-center py-5 d-none">
      <div class="spinner-border text-primary" role="status"></div>
      <div id="loadingText" class="mt-3 text-muted">Fetching Leagues...</div>
    </div>

    <!-- TAB 1: Leagues -->
    <div id="leaguesTab" class="tab-content active">
      <div id="leaguesContainer">
        <div class="text-center text-muted py-5 glass-card">Enter your username and click Load Data.</div>
      </div>
    </div>

    <!-- TAB 2: Players -->
    <div id="playersTab" class="tab-content">
      <div class="glass-card p-3">
        <table class="table table-dark table-hover align-middle mb-0">
          <thead>
            <tr class="text-secondary small text-uppercase">
              <th>Player</th>
              <th>Pos</th>
              <th>Team</th>
              <th>Shares</th>
              <th>Exposure</th>
              <th>Health</th>
            </tr>
          </thead>
          <tbody id="playersTableBody">
            <tr><td colspan="6" class="text-center text-muted py-4">Load data to see player shares.</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- Roster Modal -->
  <div class="modal fade" id="rosterModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable">
      <div class="modal-content text-white" style="background: #1a1d2d; border: 1px solid #3b4261;">
        <div class="modal-header border-bottom border-secondary">
          <h5 class="modal-title fw-bold" id="rosterModalTitle">Team Roster</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="rosterModalBody"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // --- State Variables ---
    let nflPlayersDb = {}; 
    let allLeaguesData = [];
    let isDbLoaded = false;

    // --- Initialization ---
    document.addEventListener('DOMContentLoaded', () => {
      const currentYear = new Date().getMonth() < 2 ? new Date().getFullYear() - 1 : new Date().getFullYear();
      document.getElementById('seasonSelect').innerHTML = `
        <option value="${currentYear}">${currentYear}</option>
        <option value="${currentYear - 1}">${currentYear - 1}</option>
      `;

      const savedUser = localStorage.getItem('sleeper_username');
      if (savedUser) document.getElementById('usernameInput').value = savedUser;
    });

    // --- UI Helpers ---
    function switchTab(tabId, btnElement) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.custom-tab').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btnElement.classList.add('active');
    }

    function showLoading(text) {
      document.getElementById('loadingIndicator').classList.remove('d-none');
      document.getElementById('loadingText').textContent = text;
      document.getElementById('leaguesContainer').innerHTML = '';
      document.getElementById('playersTableBody').innerHTML = '';
    }

    function hideLoading() {
      document.getElementById('loadingIndicator').classList.add('d-none');
    }

    // --- Main Fetch Logic ---
    document.getElementById('fetchBtn').addEventListener('click', async () => {
      const username = document.getElementById('usernameInput').value.trim();
      const season = document.getElementById('seasonSelect').value;
      if (!username) return alert('Enter a username.');
      localStorage.setItem('sleeper_username', username);

      showLoading('Fetching User ID...');
      
      try {
        // 1. Get User
        const userRes = await fetch(`https://api.sleeper.app/v1/user/${username}`);
        const userData = await userRes.json();
        if (!userData || !userData.user_id) throw new Error('User not found.');

        // 2. Fetch Player DB (Huge file, only fetch once per session)
        if (!isDbLoaded) {
          showLoading('Downloading NFL Player Database (Takes a few seconds)...');
          const dbRes = await fetch('https://api.sleeper.app/v1/players/nfl');
          nflPlayersDb = await dbRes.json();
          isDbLoaded = true;
        }

        // 3. Get Leagues
        showLoading(`Fetching ${season} Leagues & Rosters...`);
        const leaguesRes = await fetch(`https://api.sleeper.app/v1/user/${userData.user_id}/leagues/nfl/${season}`);
        const leagues = await leaguesRes.json();
        
        if (!leagues || leagues.length === 0) {
          hideLoading();
          document.getElementById('leaguesContainer').innerHTML = `<div class="text-center text-muted py-5 glass-card">No leagues found.</div>`;
          return;
        }

        allLeaguesData = [];
        let playerShares = {};

        // 4. Get Rosters for every league
        for (const lg of leagues) {
          const rRes = await fetch(`https://api.sleeper.app/v1/league/${lg.league_id}/rosters`);
          const rosters = await rRes.json();
          const myRoster = rosters.find(r => r.owner_id === userData.user_id);
          
          lg.myRoster = myRoster;
          allLeaguesData.push(lg);

          // Tally shares
          if (myRoster && myRoster.players) {
            myRoster.players.forEach(pid => {
              if (!playerShares[pid]) playerShares[pid] = 0;
              playerShares[pid]++;
            });
          }
        }

        hideLoading();
        renderLeagues(allLeaguesData);
        renderPlayers(playerShares, leagues.length);

      } catch (err) {
        hideLoading();
        document.getElementById('leaguesContainer').innerHTML = `<div class="text-danger py-4">${err.message}</div>`;
      }
    });

    // --- Render Leagues ---
    function renderLeagues(leagues) {
      let lineup = [], bestball = [], survivor = [];

      // Categorize
      leagues.forEach(lg => {
        const name = lg.name.toLowerCase();
        if (lg.settings && lg.settings.best_ball === 1) {
          bestball.push(lg);
        } else if (name.includes('survivor') || name.includes('eliminator') || name.includes('pool')) {
          survivor.push(lg);
        } else {
          lineup.push(lg);
        }
      });

      const container = document.getElementById('leaguesContainer');
      container.innerHTML = '';

      const buildSection = (title, arr) => {
        if (arr.length === 0) return '';
        let html = `<div class="section-header">${title} (${arr.length})</div>`;
        html += `<div class="glass-card"><table class="table table-dark table-hover align-middle mb-0">
          <thead><tr class="text-secondary small">
            <th>League</th><th>Record</th><th>Points</th><th>KTC Tool</th>
          </tr></thead><tbody>`;
        
        arr.forEach(lg => {
          const r = lg.myRoster;
          const wins = r ? r.settings.wins || 0 : 0;
          const losses = r ? r.settings.losses || 0 : 0;
          const pf = r ? parseFloat((r.settings.fpts || 0) + '.' + (r.settings.fpts_decimal || 0)).toFixed(1) : '0.0';
          const avatar = lg.avatar ? `https://sleepercdn.com/avatars/thumbs/${lg.avatar}` : 'https://sleepercdn.com/images/v2/default_avatar-512x512.png';

          html += `
            <tr>
              <td>
                <div class="d-flex align-items-center gap-3">
                  <img src="${avatar}" class="avatar-img">
                  <span class="league-link" onclick="openRoster('${lg.league_id}')">${lg.name}</span>
                </div>
              </td>
              <td><span class="badge bg-success bg-opacity-25 text-success border border-success">${wins} - ${losses}</span></td>
              <td class="fw-bold">${pf}</td>
              <td>
                <a href="https://keeptradecut.com/dynasty-rankings?leagueId=${lg.league_id}" target="_blank" class="btn btn-sm btn-outline-info rounded-pill" style="font-size: 0.75rem;">
                  <i class="bi bi-box-arrow-up-right"></i> KTC Rank
                </a>
              </td>
            </tr>`;
        });
        html += `</tbody></table></div>`;
        return html;
      };

      container.innerHTML += buildSection('Lineup Leagues', lineup);
      container.innerHTML += buildSection('Bestball Leagues', bestball);
      container.innerHTML += buildSection('Survivor Pools', survivor);
    }

    // --- Render Players Tab ---
    function renderPlayers(sharesMap, totalLeagues) {
      const tbody = document.getElementById('playersTableBody');
      tbody.innerHTML = '';

      // Convert map to array and sort by most shares
      const sortedPlayers = Object.entries(sharesMap)
        .map(([pid, shares]) => ({ pid, shares }))
        .sort((a, b) => b.shares - a.shares);

      sortedPlayers.forEach(p => {
        const dbInfo = nflPlayersDb[p.pid] || {};
        const name = dbInfo.full_name || dbInfo.first_name + " " + dbInfo.last_name || "DEF/Unknown";
        const pos = dbInfo.position || 'DEF';
        const team = dbInfo.team || 'FA';
        const health = dbInfo.injury_status || 'Active';
        const exposure = ((p.shares / totalLeagues) * 100).toFixed(1);

        let healthColor = 'status-active';
        if (health === 'Questionable' || health === 'Doubtful') healthColor = 'status-ques';
        if (health === 'Out' || health === 'IR' || health === 'PUP') healthColor = 'status-out';

        tbody.innerHTML += `
          <tr>
            <td class="fw-bold">${name}</td>
            <td><span class="badge bg-secondary">${pos}</span></td>
            <td>${team}</td>
            <td class="fw-bold text-info fs-6">${p.shares}</td>
            <td>${exposure}%</td>
            <td class="fw-semibold ${healthColor}">${health}</td>
          </tr>
        `;
      });
    }

    // --- Roster Modal Logic ---
    function openRoster(leagueId) {
      const league = allLeaguesData.find(l => l.league_id === leagueId);
      const roster = league.myRoster;
      document.getElementById('rosterModalTitle').innerText = league.name + " Roster";
      
      const body = document.getElementById('rosterModalBody');
      if (!roster || !roster.players) {
        body.innerHTML = '<p class="text-muted">No roster found.</p>';
      } else {
        const starters = roster.starters || [];
        const bench = roster.players.filter(p => !starters.includes(p));

        let html = `<h6 class="fw-bold text-primary mb-2">Starters</h6><ul class="list-group list-group-flush mb-4">`;
        starters.forEach(pid => {
           if (pid === "0") return; // Empty slot
           const p = nflPlayersDb[pid] || {};
           const name = p.full_name || p.first_name + " " + p.last_name || "DEF";
           html += `<li class="list-group-item bg-transparent text-white border-secondary d-flex justify-content-between">
              <div><strong>${name}</strong> <span class="small text-muted">${p.team || ''}</span></div>
              <span class="badge bg-primary">${p.position || ''}</span>
           </li>`;
        });
        
        html += `</ul><h6 class="fw-bold text-secondary mb-2">Bench</h6><ul class="list-group list-group-flush">`;
        bench.forEach(pid => {
           const p = nflPlayersDb[pid] || {};
           const name = p.full_name || p.first_name + " " + p.last_name || "DEF";
           html += `<li class="list-group-item bg-transparent text-white border-secondary d-flex justify-content-between">
              <div>${name} <span class="small text-muted">${p.team || ''}</span></div>
              <span class="badge bg-secondary">${p.position || ''}</span>
           </li>`;
        });
        html += `</ul>`;
        body.innerHTML = html;
      }

      new bootstrap.Modal(document.getElementById('rosterModal')).show();
    }
  </script>
</body>
</html>
