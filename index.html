<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meltdown City FF Dashboard</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <h1>🏈 Meltdown City Fantasy Dashboard</h1>
    <p>Live Sleeper League Stats & Standings</p>
  </header>

  <main>
    <section class="card search-card">
      <h2>Connect Your Sleeper League</h2>
      <div class="input-group">
        <input type="text" id="leagueIdInput" placeholder="Enter Sleeper League ID (e.g. 104800000000000000)">
        <button id="loadBtn">Load League</button>
      </div>
    </section>

    <section id="dashboard" class="hidden">
      <h2 id="leagueTitle">League Standings</h2>
      
      <div class="card">
        <table id="standingsTable">
          <thead>
            <tr>
              <th>Rank</th>
              <th>Team Name</th>
              <th>Owner</th>
              <th>W - L - T</th>
              <th>Points For</th>
              <th>Points Against</th>
            </tr>
          </thead>
          <tbody id="standingsBody">
            <!-- Dynamically populated by app.js -->
          </tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
